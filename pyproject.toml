[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "iltools"
version = "0.5.0"
authors = [{ name = "Feiyang Wu", email = "feiyang.wu@gatech.edu" }]
description = "Modular toolkit for robot imitation learning"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "pydantic",
    "rich",
    "hydra-core",
    "zarr>3",
    "aiohttp",
    "tqdm",
    "gymnasium>=1.2",
    "torch>=2.7",
    "tensordict>=0.11.0",
    "mujoco",
    "mediapy",
    "matplotlib",
    "pytest",
]

[project.optional-dependencies]
loco-mujoco = ["loco-mujoco"]
lerobot = ["lerobot"]
soma = ["py-soma-x==0.2.1", "scipy", "trimesh"]
sharpa = [
    "pyarrow>=19",
    "scipy>=1.13",
    "pin==3.7.0",
    "pin-pink==4.2.0",
    # pin 3.7 links against urdfdom 4; the package's open >=4 bound can
    # otherwise resolve to ABI-incompatible urdfdom 6.
    "cmeel-urdfdom==4.0.1",
    "cmeel-tinyxml2==10.0.0",
    "qpsolvers>=4.4",
    "daqp>=0.6.0",
]

[tool.pytest.ini_options]
addopts = "-q"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "visual: marks tests that require manual/visual inspection (deselect with '-m \"not visual\"')",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
    "ignore::FutureWarning",
    "ignore::DeprecationWarning:jaxopt.*",
    "ignore::DeprecationWarning:tensorflow_probability.*",
]

[tool.hatch.build.targets.wheel]
packages = ["iltools"]

[tool.pyrefly]
python-interpreter-path = "../.pixi/envs/default/bin/python"
search-path = [
    'iltools/datasets',
    'iltools/cli',
    'iltools/core',
    'iltools/retarget',
]
